name: Build NIKA Android APK

on:
  push:
    branches:
      - rebrand/nika-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nika-apk:
    name: Build production debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out NIKA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # The current SDK repository publishes API 37 as the versioned
          # platform package `android-37.0`, while Gradle still consumes it as
          # compileSdk 37.
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build production debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleProdDebug

      - name: Collect generated APKs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apk_files < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo 'ERROR: :app:assembleProdDebug completed without generating an APK.' >&2
            exit 1
          fi

          mkdir -p artifact
          for apk in "${apk_files[@]}"; do
            cp "$apk" "artifact/NIKA-$(basename "$apk")"
          done
          printf 'Generated APK: %s\n' "${apk_files[@]}"

      - name: Upload NIKA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKA-Android-APK
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 14
